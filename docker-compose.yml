services:
  expense-tracker:
    image: ${CONTAINER_IMAGE:-expense-tracker:local}
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_PATH: /data/expense_tracker.db
      PORT: 8000
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-}
      SMTP_START_TLS: ${SMTP_START_TLS:-}
    volumes:
      - expense-tracker-data:/data

volumes:
  expense-tracker-data:
