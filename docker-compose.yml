services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SQLSERVER_PASSWORD:?Set SQLSERVER_PASSWORD in .env}
    ports:
      - "1433:1433"
    volumes:
      - expense-tracker-sql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
  expense-tracker:
    image: ${CONTAINER_IMAGE:-expense-tracker:local}
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      SQLSERVER_DATABASE: ${SQLSERVER_DATABASE:-ExpenseTracker}
      SQLSERVER_CONNECTION_STRING: "Driver={ODBC Driver 18 for SQL Server};Server=sqlserver,1433;Database=${SQLSERVER_DATABASE:-ExpenseTracker};UID=sa;PWD=${SQLSERVER_PASSWORD:?Set SQLSERVER_PASSWORD in .env};Encrypt=yes;TrustServerCertificate=yes"
      PORT: 8000
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-}
      SMTP_START_TLS: ${SMTP_START_TLS:-}

volumes:
  expense-tracker-sql-data:
